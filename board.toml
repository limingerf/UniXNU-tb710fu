schema_version = 2

[board]
name = "tb710fu"
soc = "SM8650Q-AB"
soc_source = "sm8650"
os_profile = "macos-27.3-26C5035r"
kit = "tb710fu"
description = "Lenovo TB710FU: minimal macOS 27 kernel bring-up, storage and hardware boot unqualified"
example = false

[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "tb710fu_macos_defconfig"
config_fragments = ["arch:configs/common.config", "os:configs/macos.config"]
patch_series = [
  "arch:patches/xnu/series",
  "device:patches/pre-os/series",
  "os:patches/xnu/series",
  "device:patches/xnu/series",
]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-libpthread-kernel.py",
  "build-tb710fu-cdc-log.py",
  "build-tb710fu-live-log.py",
  "build-tb710fu-macos27-services.py",
  # GopDisplay archive deferred until after pl25 validates the 0044 39-bit user
  # pmap fix and populates the XNU compile cache.
  # "build-tb710fu-gop-display.py",
  "build-tb710fu-source-storage-archive.py",
]

[package.defconfig]
"macos-27.3-26C5035r" = "tb710fu_macos_defconfig"

[firmware]
config = "tb710fu"
dsc = "Platforms/Lenovo/tb710fuPkg/tb710fu.dsc"
fd = "Build/tb710fuPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-tb710fu-firmware.py"]
# Binaries is the Project-Silicium/Device-Binaries tree. Only the opt-in
# TB710FU_ENABLE_UFS build reads it (Binaries/giulia holds the stock Qualcomm
# DXE set); tools/ci_firmware.py clones it itself for --ufs and creates an
# empty Binaries/tb710fu for the other variants, so it is deliberately NOT in
# this submodule list (build firmware would otherwise try to re-init it and
# collide with the materialised directory).
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}", "{uefi}/Platforms/Lenovo", "{tree}/package",
  "{tree}/drivers/DarwinBoot", "{edk2}",
  "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample",
  # QrEncoderLib (OneSend log transfer) lives under Common/Mu/MsGraphicsPkg.
  "{uefi}/Common/Mu/MsGraphicsPkg",
  "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Lenovo",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
  # Board-named view of the published Qualcomm module set. tools/ci_firmware.py
  # --ufs creates Binaries/tb710fu from the tracked Binaries/giulia tree before
  # the build; the default gate never references it.
  "{uefi}/Binaries/tb710fu",
]

[firmware.defines]
# Integer model index used by the pinned canonical host builder; this board has one model.
DEVICE_MODEL = "0"
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "tb710fu-clean-development"

# [userdata] GPT geometry measured on the device in TWRP (sgdisk --print on
# /dev/block/sda, 4096-byte logical sectors). userdata is partition 14, the
# last one; the table has no free sectors. These numbers are the CAPACITY
# ceiling userdata.build checks, not the size of the produced image.
#   start 5105064, end 61390842 -> 56285779 sectors * 4096 = 214.71 GiB
[userdata]
first_lba = 5105064
last_lba = 61390842
lba_bytes = 4096

# The macOS 27 profile already provides [userdata] windows (OS, SystemOS, App)
# and [payload.adt] root_match_volume_uuid. The platform seed is device-specific
# and is supplied at build time via --unique-chip-id / UNIXNU_UNIQUE_CHIP_ID,
# never committed (see AGENTS.md: no credentials or device secrets in git).

# Identity the ADT sidecar must carry. scripts/unixnu/devicetree.py emits
# adt.root/chosen/product from the merged board config, and only emits
# unique-chip-id + chip-id when payload.adt.chip_id is set -- a bare
# --unique-chip-id raises KeyError('chip_id'). Without these two keys the
# shipped kernel.macho.adt kept the hardware DTS root identity
# (model='Qualcomm Technologies, Inc. Pineapple MTP'), had an empty /arm-io and
# no /product, so the kernel matched no macOS platform expert. Regenerating the
# same inputs with them yields model='Mac17,11', /product with 35 properties and
# /chosen osenvironment + boot-uuid + root-matching.
#   chip_id          -- Mac17,11 / T6050 identity, confirmed by the user
#   owned_memory_size -- the DarwinBoot window this board asks for (2 GiB)
# Evidence: docs/evidence/greenbar-audit.json, docs/GREENBAR_AUDIT.md
[payload.adt]
chip_id = "0x6050"
owned_memory_size = "0x80000000"
