schema_version = 2

[board]
name = "tb710fu"
soc = "SM8650Q-AB"
soc_source = "sm8650"
os_profile = "macos-27.3-26C5035r"
description = "Lenovo TB710FU: minimal macOS 27 kernel bring-up, storage and hardware boot unqualified"
example = false

[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "tb710fu_macos_defconfig"
config_fragments = ["arch:configs/common.config", "os:configs/macos.config"]
patch_series = [
  "arch:patches/xnu/series",
  "device:patches/pre-os/series",
  "os:patches/xnu/series",
  "device:patches/xnu/series",
]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-libpthread-kernel.py",
]

[package.defconfig]
"macos-27.3-26C5035r" = "tb710fu_macos_defconfig"

[firmware]
config = "tb710fu"
dsc = "Platforms/Lenovo/tb710fuPkg/tb710fu.dsc"
fd = "Build/tb710fuPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-tb710fu-firmware.py"]
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}", "{uefi}/Platforms/Lenovo", "{tree}/package",
  "{tree}/drivers/DarwinBoot", "{edk2}",
  "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Lenovo",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
DEVICE_MODEL = "tb710fu"
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "tb710fu-clean-development"
