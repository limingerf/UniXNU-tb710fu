name: TB710FU macOS 27 Data seed and userdata root image
on:
  workflow_dispatch:
    inputs:
      unique_chip_id:
        description: Device-specific platform seed as hex (from /sys/devices/soc0/serial_number)
        required: true
        default: "0x30c18713"
      data_gib:
        description: Data volume logical size in GiB (empty derives the largest the unixnu partition holds)
        required: false
        default: ""
      data_user:
        description: Local administrator NAME:PASSWORD for the seed (empty = no account)
        required: false
        default: ""
      build_data_seed:
        description: Build the writable Data seed (data.dbr). Needs only the OS component, not the root image
        type: boolean
        required: false
        default: true
      build_root_image:
        description: Also build the 16.4 GiB userdata root image (only needed when pairing a new root)
        type: boolean
        required: false
        default: false
      upload_root_image:
        description: Also upload the 16.4 GiB root image (slow; only when the OS profile changes)
        type: boolean
        required: false
        default: false
      build_gpu_addon:
        description: Build macOS 27 NativeAdrenoMetal.bundle + Turnip GPU addon (gpuaddon.bin + CDHashes)
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: tb710fu-macos-userdata
  cancel-in-progress: false
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
defaults:
  run:
    shell: bash
jobs:
  boot-shims:
    if: ${{ !inputs.build_data_seed && !inputs.build_root_image && !inputs.build_gpu_addon }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: 0c1bac3d51a3009dca1708b15a5198f4b43d057a
          path: .work/UniXNU
          persist-credentials: false
      - name: Build arm64e apfs_boot_util shim and NGPUADD2 addon (with ADSP firmware)
        run: |
          set -euo pipefail
          out=.work/boot-shims-out
          fw=.work/boot-shims-fw
          mkdir -p "$out/bootshim" "$fw/Adsp"
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          xcrun --sdk macosx clang -target arm64e-apple-macos27.0 -isysroot "$sdk" -O2 -Wall -Werror \
            .work/UniXNU/scripts/macos-boot-shims/apfs_boot_util.c -o "$out/bootshim/apfs_boot_util"
          codesign --force --sign - --pagesize 4096 --identifier org.unixnu.apfs_boot_util "$out/bootshim/apfs_boot_util"
          codesign --verify --strict "$out/bootshim/apfs_boot_util"
          cdhash=$(codesign --display --verbose=4 "$out/bootshim/apfs_boot_util" 2>&1 | sed -n 's/^CDHash=\([0-9a-f]\{40\}\)$/\1/p')
          test -n "$cdhash"
          echo "$cdhash" > "$out/cdhash.txt"
          # The ADSP firmware rides in the same addon: entry paths EFI/UniXNU/firmware/Adsp/..., the layout UniXNU's
          # firmware loader reads (PianoFirmware.h). Pinned Linux port archive, byte-checked per file; the blob is never
          # committed, only downloaded in this job.
          curl -fsSL --retry 3 --retry-delay 5 -o "$fw/firmware.tar.gz" \
            "https://raw.githubusercontent.com/MeteoricmeteorLL/tb710fu-linux/16e800d4f6e5cf4a8517900a9e11eec0ebc91bd3/firmware/tb710fu-firmware-20261005.tar.gz"
          test "$(md5 -q "$fw/firmware.tar.gz")" = "c29a0af246551ea07983cdcc5876315f"
          gt=lib/firmware/qcom/sm8650/xiaoxin/gt
          tar -xzf "$fw/firmware.tar.gz" -C "$fw" "$gt/adsp.mbn" "$gt/adsp_dtb.mbn"
          cp "$fw/$gt/adsp.mbn" "$fw/Adsp/adsp.mbn"
          cp "$fw/$gt/adsp_dtb.mbn" "$fw/Adsp/adsp_dtb.mbn"
          chmod 0644 "$fw/Adsp/adsp.mbn" "$fw/Adsp/adsp_dtb.mbn"
          test "$(md5 -q "$fw/Adsp/adsp.mbn")" = "a0686c2b0ed4b6a8a0250c31aa2bc46c"
          test "$(md5 -q "$fw/Adsp/adsp_dtb.mbn")" = "4b2480da1dbff4932c6d9f4eb40222e4"
          python3 -c 'import struct, pathlib; pathlib.Path(".work/boot-shims-out/empty.bin").write_bytes(b"NGPUADD2" + struct.pack("<IIQ", 0, 0, 24))'
          python3 .work/UniXNU/scripts/addon-add-dir.py "$out/empty.bin" "$out/boot-shims.bin" \
            bootshim "$out/bootshim" EFI/UniXNU/firmware/Adsp "$fw/Adsp"
          rm -f "$out/empty.bin"
          rm -rf "$fw"
          shasum -a 256 "$out/boot-shims.bin" "$out/bootshim/apfs_boot_util"
          ls -l "$out/boot-shims.bin"
          echo "CDHash=$cdhash"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tb710fu-boot-shims-${{ github.run_id }}
          path: .work/boot-shims-out/
          retention-days: 7
  seed:
    if: ${{ inputs.build_data_seed }}
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: 0c1bac3d51a3009dca1708b15a5198f4b43d057a
          path: .work/UniXNU
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Check out DarwinBoot for the packed RAM disk module
        run: |
          set -euo pipefail
          # make-data-seed.py imports packed_ramdisk from drivers/DarwinBoot/Test,
          # which is a submodule the framework checkout leaves empty. Fetch only
          # that one at the revision the framework pins, so the packing format
          # matches the loader the payload is later built against.
          git -C .work/UniXNU submodule update --init --depth 1 -- drivers/DarwinBoot
          test -f .work/UniXNU/drivers/DarwinBoot/Test/packed_ramdisk.py
          # Apply upstream UniXNU/UniXNU seed-data-grow.py fixes for macOS 26
          # runners (1a71ace5: wait for attached APFS container before resizing;
          # ce025d6b: identify attached disks by type instead of output order).
          git -C .work/UniXNU fetch --depth 1 origin ce025d6bc87e550590aa1e972191d98a67fa17c5
          git -C .work/UniXNU checkout ce025d6bc87e550590aa1e972191d98a67fa17c5 -- scripts/seed-data-grow.py
      - name: Install the AEA key tool and verify macOS image tools
        run: |
          set -euo pipefail
          # /usr/bin/aea and hdiutil ship with macOS. The `ipsw` tool fetches the
          # per-archive key from the URL in the AEA header (ipsw.py:decrypt_aea).
          brew install blacktop/tap/ipsw
          test -x /usr/bin/aea
          test -x /usr/bin/hdiutil
          test -x "$(command -v ipsw)"
      - name: Build the writable Data seed
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ inputs.unique_chip_id }}
          DATA_GIB: ${{ inputs.data_gib }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only the OS component is fetched (by range) and decrypted; the root
          # image is not built. The seed is a small packed APFS OwnerData
          # container (DBRDISK1: zero pages dropped) that the kernel mounts as the
          # ramdisk behind /System/Volumes/Data. Without it launchd starts and
          # restarts. The limit is the payload FAT's spare space, measured at
          # 5,752,320 bytes: mcopy never grows that filesystem.
          python3 tools/ci_userdata.py seed \
            --data-gib "${DATA_GIB:-120}" \
            --data-user "${{ inputs.data_user }}" \
            --volume-uuid "A7B710F0-8650-4D27-9A01-26C5035F0001" \
            --data-seed-max-bytes 0
      - name: Collect seed evidence
        if: always()
        run: python3 tools/ci_userdata.py collect || true
      - name: Upload Data seed
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tb710fu-data-seed-${{ github.run_id }}
          path: .work/artifacts/
          if-no-files-found: error
          retention-days: 14

  userdata:
    if: ${{ inputs.build_root_image }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: 0c1bac3d51a3009dca1708b15a5198f4b43d057a
          path: .work/UniXNU
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Check out DarwinBoot for the packed RAM disk module
        run: |
          set -euo pipefail
          # make-data-seed.py imports packed_ramdisk from drivers/DarwinBoot/Test,
          # which is a submodule the framework checkout leaves empty. Fetch only
          # that one at the revision the framework pins, so the packing format
          # matches the loader the payload is later built against.
          git -C .work/UniXNU submodule update --init --depth 1 -- drivers/DarwinBoot
          test -f .work/UniXNU/drivers/DarwinBoot/Test/packed_ramdisk.py
          # Apply upstream UniXNU/UniXNU seed-data-grow.py fixes for macOS 26
          # runners (1a71ace5: wait for attached APFS container before resizing;
          # ce025d6b: identify attached disks by type instead of output order).
          git -C .work/UniXNU fetch --depth 1 origin ce025d6bc87e550590aa1e972191d98a67fa17c5
          git -C .work/UniXNU checkout ce025d6bc87e550590aa1e972191d98a67fa17c5 -- scripts/seed-data-grow.py
      - name: Install the AEA key tool and verify macOS image tools
        run: |
          set -euo pipefail
          # /usr/bin/aea and hdiutil ship with macOS. The `ipsw` tool fetches the
          # per-archive key from the URL in the AEA header (ipsw.py:decrypt_aea).
          brew install blacktop/tap/ipsw
          # Only presence is checked here: `ipsw` has no --version flag, and the
          # actual `ipsw fw aea --key` call is exercised by the build itself.
          test -x /usr/bin/aea
          test -x /usr/bin/hdiutil
          test -x "$(command -v ipsw)"
      - name: Dry-run the userdata build (IPSW identity, members, capacity)
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ inputs.unique_chip_id }}
        run: |
          set -euo pipefail
          python3 tools/ci_userdata.py dry-run
      - name: Build the userdata root image
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ inputs.unique_chip_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/ci_userdata.py build
      - name: Collect reports
        if: always()
        env:
          UPLOAD_ROOT_IMAGE: ${{ inputs.upload_root_image }}
        run: |
          python3 tools/ci_userdata.py collect || true
          # The root image is 16.4 GiB. Uploading it every run costs more than a
          # build and it never changes unless the OS profile does, so it is staged
          # only when explicitly asked for. The seed and the reports always go up:
          # they are the output this workflow exists to produce.
          WORK=$(cat .work/resolved-work.txt 2>/dev/null || true)
          if [ "${UPLOAD_ROOT_IMAGE:-false}" = "true" ] && [ -n "$WORK" ] \
             && [ -f "$WORK/userdata/userdata-root.img" ]; then
            cp "$WORK/userdata/userdata-root.img" .work/artifacts/userdata-root.img
          fi
      - name: Upload private userdata evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tb710fu-macos-userdata-${{ github.run_id }}
          path: .work/artifacts/
          if-no-files-found: error
          retention-days: 3

  gpu-addon:
    if: ${{ inputs.build_gpu_addon }}
    name: macos27 GPU addon (NativeAdrenoMetal + Turnip)
    runs-on: macos-26
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
      UNIXNU_COMMIT: 0c1bac3d51a3009dca1708b15a5198f4b43d057a
      ADRENO740_COMMIT: 6fa7bae2a5b3b523e790eb3e0348af4d98969e4d
      GPU_ADDON_BUDGET: 7864320
    steps:
      - uses: actions/checkout@v4
      - name: Framework at pinned revision
        run: |
          set -euo pipefail
          mkdir -p .work
          git clone --filter=blob:none https://github.com/UniXNU/UniXNU.git .work/UniXNU
          git -C .work/UniXNU checkout "${UNIXNU_COMMIT}"
          git clone --filter=blob:none https://github.com/UniXNU/Adreno740.git .work/UniXNU/drivers/Adreno740
          git -C .work/UniXNU/drivers/Adreno740 checkout "${ADRENO740_COMMIT}"
      - name: Tools
        run: |
          set -euo pipefail
          brew install llvm lld cmake ninja dtc mtools glslang unifdef || true
          for tool in glslangValidator cmake ninja dtc mtools; do
            command -v "${tool}" >/dev/null || { echo "${tool} missing" >&2; exit 1; }
          done
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          cargo +1.98.0 --version
      - name: Build Turnip, NativeAdrenoMetal.bundle and gpuaddon.bin
        run: |
          set -euo pipefail
          mkdir -p build
          python3 scripts/build-tb710fu-gpu-addon.py \
            --framework .work/UniXNU \
            --out build/tb710fu-gpu-addon \
            --budget-bytes "${GPU_ADDON_BUDGET}" \
            --publish
      - name: Upload GPU addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: tb710fu-gpu-addon-${{ github.run_id }}
          path: |
            build/tb710fu-gpu-addon/gpuaddon.bin
            build/tb710fu-gpu-addon/report.json
            build/tb710fu-gpu-addon/gpu-owner-trust.bundle
          if-no-files-found: warn
          retention-days: 7
