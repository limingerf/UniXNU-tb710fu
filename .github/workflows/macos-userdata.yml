name: TB710FU macOS 27 userdata root image
on:
  workflow_dispatch:
    inputs:
      unique_chip_id:
        description: Device-specific platform seed as hex (from /sys/devices/soc0/serial_number)
        required: true
        default: "0x30c18713"
permissions:
  contents: read
  actions: read
concurrency:
  group: tb710fu-macos-cloud
  cancel-in-progress: false
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
defaults:
  run:
    shell: bash
jobs:
  userdata:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: 0c1bac3d51a3009dca1708b15a5198f4b43d057a
          path: .work/UniXNU
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install the AEA key tool and verify macOS image tools
        run: |
          set -euo pipefail
          # /usr/bin/aea and hdiutil ship with macOS. The `ipsw` tool fetches the
          # per-archive key from the URL in the AEA header (ipsw.py:decrypt_aea).
          brew install blacktop/tap/ipsw
          command -v /usr/bin/aea
          command -v hdiutil
          command -v ipsw
          ipsw --version
      - name: Dry-run the userdata build (IPSW identity, members, capacity)
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ inputs.unique_chip_id }}
        run: |
          set -euo pipefail
          python3 tools/ci_userdata.py dry-run
      - name: Build the userdata root image
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ inputs.unique_chip_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/ci_userdata.py build
      - name: Collect reports
        if: always()
        run: |
          python3 tools/ci_userdata.py collect || true
          # stage the large image next to the reports for upload
          WORK=$(cat .work/resolved-work.txt 2>/dev/null || true)
          if [ -n "$WORK" ] && [ -f "$WORK/userdata/userdata-root.img" ]; then
            cp "$WORK/userdata/userdata-root.img" .work/artifacts/userdata-root.img
          fi
      - name: Upload private userdata evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tb710fu-macos-userdata-${{ github.run_id }}
          path: .work/artifacts/
          if-no-files-found: error
          retention-days: 3
