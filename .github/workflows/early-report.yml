name: TB710FU early XNU report source check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tb710fu-early-report
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
jobs:
  reporter:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install standalone compiler
        run: |
          set -euo pipefail
          brew install llvm
          if ! command -v node >/dev/null; then brew install node; fi
          node --version
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Compile pinned encoder and reporter, verify OneSend file reception
        run: python3 tools/ci_early_report.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tb710fu-early-report-${{ github.run_id }}
          path: .work/early-report-artifacts/
          if-no-files-found: error
          retention-days: 3
