name: TB710FU macOS 27 kernel
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Native compiler/linker check first; prelink also adds the original macOS kernelcache closure
        type: choice
        options: [native, prelink]
        default: native
permissions:
  contents: read
concurrency:
  group: tb710fu-macos-cloud
  cancel-in-progress: false
env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
defaults:
  run:
    shell: bash
jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out the private device project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out the pinned official framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: 0c1bac3d51a3009dca1708b15a5198f4b43d057a
          path: .work/UniXNU
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Validate macOS profile and source locks
        run: python3 tools/ci_kernel.py configure
      - name: Install the official host tools
        run: |
          set -euo pipefail
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk macosx --show-sdk-version
          df -h .
      - name: Build and verify the native arm64e kernel
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOBS: '3'
        run: python3 tools/ci_kernel.py native
      - name: Prelink the macOS 27 kernelcache closure
        if: inputs.stage == 'prelink'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci_kernel.py prelink
      - name: Collect the selected logs and artifacts
        if: always()
        run: python3 tools/ci_kernel.py collect
      - name: Upload private build artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tb710fu-${{ inputs.stage }}-${{ github.run_id }}
          path: .work/artifacts/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 3
