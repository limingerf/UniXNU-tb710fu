name: TB710FU macOS 27 kernel
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Native compiler/linker check first; prelink also adds the original macOS kernelcache closure
        type: choice
        options: [native, prelink, ufs-source, ufs-bridges, ufs-integrated]
        default: native
permissions:
  contents: read
concurrency:
  group: tb710fu-macos-cloud
  cancel-in-progress: false
env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
defaults:
  run:
    shell: bash
jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out the private device project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out the pinned official framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: 0c1bac3d51a3009dca1708b15a5198f4b43d057a
          path: .work/UniXNU
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Validate macOS profile and source locks
        run: python3 tools/ci_kernel.py configure
      - name: Exercise the actual CDC protocol, hardware predicates and DWC3 core
        run: |
          set -euo pipefail
          python3 scripts/check_usb_cdc_protocol.py
          python3 scripts/check_usb_cdc_hardware.py
          python3 scripts/check_usb_cdc_transport.py
          python3 scripts/check_boot_mark_names.py
      - name: Check actual ramoops snapshots and live log display/protocol
        run: |
          set -euo pipefail
          python3 scripts/check_ramoops_snapshot.py --output-dir .work/artifacts/ramoops-snapshot-check
          python3 scripts/check_live_log_display.py --report .work/artifacts/live-display-check.json
          python3 scripts/check_live_log_protocol.py --output-dir .work/artifacts/live-protocol-check
          python3 scripts/check_live_xnu_adapter.py --cc clang --output-dir .work/artifacts/live-adapter-check
      - name: Install the official host tools
        run: |
          set -euo pipefail
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk macosx --show-sdk-version
          df -h .
      # A cold cloud run compiles ~950 XNU objects twice: one bootstrap pass that only
      # leaves the compile records and one real pass with the archive set (CURRENT_STATUS
      # measured 335 s of the 510 s native step in the bootstrap pass alone).  The object
      # files depend on the pinned UniXNU/XNU commits, the resolved arch/OS/device patch
      # series, the kernel defconfig, the board and the compiler - never on package/ or
      # scripts/build-tb710fu-*.py, which reach the kernel only through the archive link.
      # tools/ci_cache.py computes that identity, proves a restored tree belongs to it,
      # pins its mtimes and drops the kernel link output so every run links fresh.
      - name: Record the runner compiler identity
        run: |
          set -euo pipefail
          {
            echo "CI_XCODE_VERSION=$(xcodebuild -version | tr '\n' ' ' | sed 's/  */ /g')"
            echo "CI_MACOS_SDK=$(xcrun --sdk macosx --show-sdk-version)"
            echo "CI_IPHONEOS_SDK=$(xcrun --sdk iphoneos --show-sdk-version)"
            echo "CI_HOST=$(sw_vers -productVersion)-$(uname -m)"
          } >> "$GITHUB_ENV"
      - name: Compute the cloud-build cache identity
        id: cache-key
        run: python3 tools/ci_cache.py key --github-output "$GITHUB_OUTPUT"
      - name: Initialize the pinned UFS interface headers
        run: git -C .work/UniXNU submodule update --init --depth 1 -- kits/VerifiedRoot drivers/VirtioMmioBlock drivers/RamBlock drivers/AppleKeyStoreState drivers/SoftwareAES drivers/GopFramebuffer
      # No restore-keys: an object tree produced by a different patch series must never
      # be reused, and the key is the whole input manifest.  Each cache is independent so
      # a patch edit only costs the XNU compile and keeps the pinned source checkouts.
      - name: Restore the pinned source checkouts
        id: restore-feeds
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache v4.3.0
        with:
          path: .work/UniXNU/out/feeds
          key: ${{ steps.cache-key.outputs.feeds-key }}
          fail-on-cache-miss: false
      - name: Restore the XNU compile cache
        id: restore-xnu
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache v4.3.0
        with:
          path: |
            .work/UniXNU/out/tb710fu/*/tb710fu_macos/tree/build/xnu/ios-obj
            .work/UniXNU/out/tb710fu/*/tb710fu_macos/tree/.cache/xnu-work
            .work/UniXNU/out/tb710fu/*/tb710fu_macos/tree/.cache/fakeroot
            .work/UniXNU/out/tb710fu/*/tb710fu_macos/tree/.cache/sources
            .work/UniXNU/out/tb710fu/*/tb710fu_macos/xnu-inputs.json
            .work/UniXNU/out/tb710fu/*/tb710fu_macos/.ci-cache
          key: ${{ steps.cache-key.outputs.xnu-key }}
          fail-on-cache-miss: false
      - name: Validate the restored XNU state and pin its timestamps
        id: adopt
        run: python3 tools/ci_cache.py adopt --key "${{ steps.cache-key.outputs.xnu-key }}" --github-output "$GITHUB_OUTPUT"
      # The tree is assembled before the cache is restored, so a restored tree can still carry the
      # scripts from the run that filled the cache.  Copy the checked-out device scripts over it and
      # drop stale bytecode before any archive runs: the compile recipe lives in those scripts.
      - name: Refresh the device build scripts in the tree
        run: |
          set -euo pipefail
          for tree in .work/UniXNU/out/tb710fu/*/tb710fu_macos/tree; do
            [ -d "$tree/scripts" ] || continue
            cp -R scripts/. "$tree/scripts/"
            find "$tree/scripts" -type d -name __pycache__ -prune -exec rm -rf {} +
            shasum -a 256 "$tree/scripts/build-tb710fu-adsp.py"
          done
      - name: Build and verify the native arm64e kernel
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOBS: '3'
        run: python3 tools/ci_kernel.py native
      # Only a successful build may be cached, so the identity is recorded here and
      # never from a post-job hook.  record refuses to write the state when any
      # .tb710fu-*-link-input.json stamp no longer matches the archive bytes on disk,
      # which keeps a stale tree out of the cache; CURRENT_STATUS.md keeps the stage
      # wording, so a cache hit still only claims a native kernel, never a prelink.
      - name: Record the compiled XNU objects for the cache
        run: python3 tools/ci_cache.py record --key "${{ steps.cache-key.outputs.xnu-key }}"
      - name: Save the XNU compile cache
        if: success() && steps.restore-xnu.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache v4.3.0
        with:
          path: |
            .work/UniXNU/out/tb710fu/*/tb710fu_macos/tree/build/xnu/ios-obj
            .work/UniXNU/out/tb710fu/*/tb710fu_macos/tree/.cache/xnu-work
            .work/UniXNU/out/tb710fu/*/tb710fu_macos/tree/.cache/fakeroot
            .work/UniXNU/out/tb710fu/*/tb710fu_macos/tree/.cache/sources
            .work/UniXNU/out/tb710fu/*/tb710fu_macos/xnu-inputs.json
            .work/UniXNU/out/tb710fu/*/tb710fu_macos/.ci-cache
          key: ${{ steps.cache-key.outputs.xnu-key }}
      - name: Save the pinned source checkouts
        if: success() && steps.restore-feeds.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache v4.3.0
        with:
          path: .work/UniXNU/out/feeds
          key: ${{ steps.cache-key.outputs.feeds-key }}
      # A patch series is authored against the tree the series itself produces,
      # not against the pristine checkout: earlier patches shift line numbers and
      # rewrite surrounding context. ci_kernel native applies the series, so the
      # patched sources are exported here for authoring the next patch against
      # the state the compiler actually saw.
      - name: Export the patched sources for patch authoring
        if: always()
        run: |
          set -euo pipefail
          work=$(cat .work/resolved-work.txt)
          out=.work/artifacts/patched-sources
          mkdir -p "$out"
          cp "$work/tree/.cache/xnu-work/bsd/kern/bsd_init.c" "$out/bsd_init.c"
          cp "$work/tree/.cache/xnu-work/bsd/net/dlil.c" "$out/dlil.c"
          cp "$work/tree/.cache/xnu-work/osfmk/kern/tb710fu_live_log.h" "$out/tb710fu_live_log.h"
          cp "$work/tree/.cache/xnu-work/bsd/dev/dtrace/sdt.c" "$out/sdt.c"
          cp "$work/tree/.cache/xnu-work/bsd/dev/dtrace/lockstat.c" "$out/lockstat.c"
          sha256sum "$out"/* | tee "$out/SHA256SUMS"
      - name: Exercise actual pinned Mu encoding and the native QR adapter
        run: |
          set -euo pipefail
          work=$(cat .work/resolved-work.txt)
          python3 scripts/check_live_log_qr.py --qr-source "$work/tree/build/tb710fu-live-log/upstream" --output-dir .work/artifacts/live-qr-check --xnu-debug 0
          python3 scripts/check_live_log_qr.py --qr-source "$work/tree/build/tb710fu-live-log/upstream" --output-dir .work/artifacts/live-qr-debug1-check --xnu-debug 1
          python3 scripts/check_live_console_capture.py --cc clang --xnu "$work/tree/.cache/xnu-work" --framework .work/UniXNU --output-dir .work/artifacts/live-console-check
      # The prelink closure reads the Apple kernelcache, pinned by kernelcache_sha256 in
      # upstream.lock.json.  unixnu re-verifies that digest before use and re-decodes on
      # a mismatch, so a restored copy cannot smuggle in a different kernelcache.
      - name: Restore the verified macOS kernelcache input
        if: inputs.stage == 'prelink' || inputs.stage == 'ufs-integrated'
        id: restore-kernelcache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache v4.3.0
        with:
          path: .work/UniXNU/out/ipsw/*/kernelcache.decompressed
          key: ${{ steps.cache-key.outputs.ipsw-key }}
          fail-on-cache-miss: false
      - name: Prelink the macOS 27 kernelcache closure
        if: inputs.stage == 'prelink' || inputs.stage == 'ufs-integrated'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci_kernel.py prelink
      - name: Save the verified macOS kernelcache input
        if: success() && (inputs.stage == 'prelink' || inputs.stage == 'ufs-integrated') && steps.restore-kernelcache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache v4.3.0
        with:
          path: .work/UniXNU/out/ipsw/*/kernelcache.decompressed
          key: ${{ steps.cache-key.outputs.ipsw-key }}
      - name: Compile the pinned TB710FU UFS source adapter
        if: inputs.stage == 'ufs-source'
        env:
          UNIXNU_XNU_ARCH: arm64e
          UNIXNU_IOS_VERSION: '27.0'
          UNIXNU_XNU_TARGET: macosx
        run: |
          set -euo pipefail
          work=$(cat .work/resolved-work.txt)
          adapter="$work/tree/build/tb710fu-ufs-adapter"
          python3 scripts/build-tb710fu-ufs-adapter.py --tree "$work/tree" --framework .work/UniXNU
          cp "$adapter/build-report.json" .work/artifacts/ufs-adapter-build.json
          cp "$adapter/libTb710fuNativeUfs.a" .work/artifacts/
          cp "$adapter/compile.log" .work/artifacts/ufs-adapter-compile.log
          cp "$adapter/compile-command.json" .work/artifacts/ufs-adapter-compile-command.json
          cp "$adapter/host-tests.json" .work/artifacts/ufs-adapter-host-tests.json
          cat "$adapter/build-report.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the fileset with the production DarwinBoot parser
        if: inputs.stage == 'prelink' || inputs.stage == 'ufs-integrated'
        run: |
          set -euo pipefail
          work=$(cat .work/resolved-work.txt)
          python3 .work/UniXNU/drivers/DarwinBoot/Test/test-kernel-parser.py "$work/kernel/kernel.macho" 2>&1 | tee .work/artifacts/loader-parser.log
      - name: Compile the complete standalone source-storage archive
        if: inputs.stage == 'ufs-bridges'
        env:
          UNIXNU_XNU_ARCH: arm64e
          UNIXNU_IOS_VERSION: '27.0'
          UNIXNU_XNU_TARGET: macosx
        run: |
          set -euo pipefail
          work=$(cat .work/resolved-work.txt)
          python3 scripts/build-tb710fu-source-storage.py --tree "$work/tree" --framework .work/UniXNU
          cat "$work/tree/build/tb710fu-source-storage/build-report.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Collect the selected logs and artifacts
        if: always()
        run: python3 tools/ci_kernel.py collect
      - name: Upload private build artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tb710fu-${{ inputs.stage }}-${{ github.run_id }}
          path: .work/artifacts/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 3
