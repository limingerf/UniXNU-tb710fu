name: TB710FU macOS 27 kernel
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Native compiler/linker check first; prelink also adds the original macOS kernelcache closure
        type: choice
        options: [native, prelink, ufs-source, ufs-bridges, ufs-integrated]
        default: native
permissions:
  contents: read
concurrency:
  group: tb710fu-macos-cloud
  cancel-in-progress: false
env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
defaults:
  run:
    shell: bash
jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out the private device project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out the pinned official framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: 0c1bac3d51a3009dca1708b15a5198f4b43d057a
          path: .work/UniXNU
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Validate macOS profile and source locks
        run: python3 tools/ci_kernel.py configure
      - name: Install the official host tools
        run: |
          set -euo pipefail
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk macosx --show-sdk-version
          df -h .
      - name: Initialize the pinned UFS interface headers
        run: git -C .work/UniXNU submodule update --init --depth 1 -- kits/VerifiedRoot drivers/VirtioMmioBlock
      - name: Build and verify the native arm64e kernel
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOBS: '3'
        run: python3 tools/ci_kernel.py native
      - name: Prelink the macOS 27 kernelcache closure
        if: inputs.stage == 'prelink' || inputs.stage == 'ufs-integrated'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci_kernel.py prelink
      - name: Compile the pinned TB710FU UFS source adapter
        if: inputs.stage == 'ufs-source'
        env:
          UNIXNU_XNU_ARCH: arm64e
          UNIXNU_IOS_VERSION: '27.0'
          UNIXNU_XNU_TARGET: macosx
        run: |
          set -euo pipefail
          work=$(cat .work/resolved-work.txt)
          adapter="$work/tree/build/tb710fu-ufs-adapter"
          python3 scripts/build-tb710fu-ufs-adapter.py --tree "$work/tree" --framework .work/UniXNU
          cp "$adapter/build-report.json" .work/artifacts/ufs-adapter-build.json
          cp "$adapter/libTb710fuNativeUfs.a" .work/artifacts/
          cp "$adapter/compile.log" .work/artifacts/ufs-adapter-compile.log
          cp "$adapter/compile-command.json" .work/artifacts/ufs-adapter-compile-command.json
          cp "$adapter/host-tests.json" .work/artifacts/ufs-adapter-host-tests.json
          cat "$adapter/build-report.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the fileset with the production DarwinBoot parser
        if: inputs.stage == 'prelink' || inputs.stage == 'ufs-integrated'
        run: |
          set -euo pipefail
          work=$(cat .work/resolved-work.txt)
          python3 .work/UniXNU/drivers/DarwinBoot/Test/test-kernel-parser.py "$work/kernel/kernel.macho" 2>&1 | tee .work/artifacts/loader-parser.log
      - name: Compile the complete standalone source-storage archive
        if: inputs.stage == 'ufs-bridges'
        env:
          UNIXNU_XNU_ARCH: arm64e
          UNIXNU_IOS_VERSION: '27.0'
          UNIXNU_XNU_TARGET: macosx
        run: |
          set -euo pipefail
          work=$(cat .work/resolved-work.txt)
          python3 scripts/build-tb710fu-source-storage.py --tree "$work/tree" --framework .work/UniXNU
          cat "$work/tree/build/tb710fu-source-storage/build-report.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Collect the selected logs and artifacts
        if: always()
        run: python3 tools/ci_kernel.py collect
      - name: Upload private build artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tb710fu-${{ inputs.stage }}-${{ github.run_id }}
          path: .work/artifacts/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 3
