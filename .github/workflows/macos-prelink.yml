name: TB710FU strict macOS prelink
on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Successful native run with an unexpired artifact and identical kernel inputs
        required: true
        default: '43615291360'
permissions:
  contents: read
  actions: read
concurrency:
  group: tb710fu-macos-cloud
  cancel-in-progress: false
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
defaults:
  run:
    shell: bash
jobs:
  prelink:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: UniXNU/UniXNU
          ref: 0c1bac3d51a3009dca1708b15a5198f4b43d057a
          path: .work/UniXNU
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Validate and import the exact native artifact, then prelink
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        run: |
          set -euo pipefail
          [[ "$NATIVE_RUN_ID" =~ ^[0-9]+$ ]]
          python3 tools/ci_kernel.py reuse-prelink --native-run "$NATIVE_RUN_ID"
      - name: Collect prelink reports
        if: always()
        run: python3 tools/ci_kernel.py collect
      - name: Upload private prelink evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tb710fu-strict-prelink-${{ github.run_id }}
          path: .work/artifacts/
          if-no-files-found: error
          retention-days: 3
