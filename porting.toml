schema_version = 1

[device]
name = "tb710fu"
soc = "SM8650Q-AB"
os_profile = "macos-27.3-26C5035r"
summary = "Clean macOS 27 source-storage kernel for Lenovo TB710FU. Native compilation, integration checks, strict prelink and production loader parsing passed; hardware storage, USB CDC and macOS userspace remain unqualified."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "XnuPrelink"]
paths = ["board.toml", "feeds.toml", "configs/**", "soc/**", "upstream.lock.json", ".github/**", ".gitignore", ".gitattributes", "AGENTS.md"]
inputs = ["Pinned official UniXNU and XNU revisions in upstream.lock.json; the macos-27.3-26C5035r profile; the repository-local soc feed."]
configuration = ["board.toml selects ArmDTPlatform, ArmCpu and XnuPrelink. Its explicit archive and patch arrays replace inherited arrays; preserve the recorded order.", "The patch order is arch, device pre-OS, OS, then device XNU. The kernel configuration includes arch common and OS macOS fragments."]
procedure = ["1. Resolve the pinned official checkout and profile without editing fetched source caches.", "2. Generate the selected defconfig and inspect the resolved status and component dependencies.", "3. Run one bounded macOS CI target at a time and retain the source revisions, invocation and first actual failure or kernel artifact."]
findings = ["The explicit device archive now selects the independent DWC3 CDC transport and XNU worker, with XNU_TB710FU_CDC=1 and its pre-vfsinit strong BSD startup hook. Runtime takeover remains opt-in through tb710fu-cdc=1. Source-storage remains selected with automatic UFS personalities disabled.", "The previous workspace mixes initial skeletons and later experiments. It is evidence only and is not a feed for this clean build."]
completion = ["Official record validation and resolved status pass with the intended identity, component closure, OS profile, archives and patch order."]
limits = ["Run 44088845841 passed complete six-source CDC and source-storage native integration, strict prelink and production loader parsing. The 15-input unsigned candidate passed independent packaging. No device boot, USB enumeration or runtime storage qualification is claimed."]
next_action = ["Qualify initial CDC enumeration and captured log bytes on TB710FU using the exact CDC-enabled candidate and recorded loader provenance."]
evidence = [{ kind = "source", reference = "board.toml", result = "Defines the clean schema-2 identity, selected components and ordered kernel inputs." }, { kind = "source", reference = "upstream.lock.json", result = "Pins the official UniXNU, XNU, OS profile and mainline hardware reference." }, { kind = "host", reference = "https://github.com/limingerf/UniXNU-tb710fu/actions/runs/43844823907", command = "workflow_dispatch stage=prelink", revision = "e83bd00d94fc947ecdefd3fafdd471711561dff3", result = "Native arm64e compilation, strict prelink and production DarwinBoot parser passed. Prelinked kernel SHA-256 045bfc7cfad9ed2539a586043dd43211263099734f4978abd8092c213b7d7d95; 86 retained components, no missing or stubbed symbols. Hardware remains unqualified." }, { kind = "host", reference = "docs/evidence/usb-cdc-integrated-44088845841.json", command = "TB710FU macOS 27 kernel workflow_dispatch stage=ufs-integrated; verify native CDC/storage integration, strict prelink and production DarwinBoot parser", revision = "c0154c9d5e7048f7896614e1ca8d65be7d4d0e10", result = "Run 44088845841 passed all three sanitized CDC host checks, six-source actual target compilation, strong BSD/native integration, strict prelink and production parser. ZIP SHA-256 346ec4a926a72bf6bc52768aaa50546858f966c629db20a820859ea8deef8369 independently matched. Actual COM enumeration remains unverified." }, { kind = "host", reference = "docs/evidence/usb-cdc-image-44088845841.json", command = "python3 tools/package_source_storage.py --manifest <recorded-inputs.json> --manifest-sha256 f32068c96c0a635c11ffc088cd77df6463249ffebe54b4fd5bf2242cf64c98b2 --output-dir out/usb-cdc-44088845841", revision = "c0154c9d5e7048f7896614e1ca8d65be7d4d0e10", result = "All 15 exact inputs, six actual CDC objects and 12 strong final transport definitions passed with the existing signature/parser/loader/LZMA/ADT/FAT gates. Unsigned image is 37859328 bytes, SHA-256 49b216089db0cec46772cbba068178fb82e12d86af3ba0c5e925cf0a26ed416c. tb710fu-cdc=1 selected; no private key, signing or device operation." }, { kind = "host", reference = "docs/evidence/usb-cdc-signed-44088845841.json", command = "Unchanged tools/sign_kernel_probe_pair.py with exact unsigned SHA; independently recompute RSA, salted hashes, descriptor equality, boot chain key and FAT/kernel readback", revision = "ebeff37f24c6a6eedf2f91210bda772a32bef099", result = "Explicit user-authorized local signing completed. Signed vendor_boot SHA-256 80fd313b2c349bb89fa3790dc6caf4fd577ad09f0767ec79c2de7c71f796b279; matching vbmeta e8a4d1da9db5d60dedeade8ab3d12ae12f45d84be8b7bb036bcba101d2865323. Existing matching boot included. All three RSA structures, boot/vendor hashes, 22 unrelated descriptors, header/key/rollback and payload readback passed. No device operation or actual CDC enumeration." }]

[[area]]
id = "firmware"
status = "host-verified"
components = ["DarwinBoot"]
paths = ["uefi/**", "firmware/**", "proprietary-files.txt", "scripts/*firmware*", "scripts/*bootimg*"]
inputs = ["A clean pinned UEFI base and reviewed TB710FU overlay; locally held stock boot-chain backups; a qualified firmware DTB and framebuffer handoff."]
configuration = ["board.toml firmware selects the reviewed source-only TB710FU overlay on uefi-sheng 66421cb7; vendor gates remain closed.", "A separate shared SimpleFb patch validates memory lookup, range and GOP error paths. Tb710fuKeyInputDxe reads physical PMIC status through the v7 observer and publishes SimpleTextIn; source provenance and host checks are in docs/UEFI_INPUT.md."]
procedure = ["1. Check out pinned official UniXNU and uefi-sheng sources.", "2. Apply the reviewed source patch and board overlay, then run the source-policy preflight.", "3. Run the official build firmware command and inspect required GUIDs in the real nested FV/FFS volumes."]
findings = ["Previous evidence records FD base 0xA7100000, FD size 0x300000 and Android boot header version 4. These are import candidates, not clean-build verification.", "The previous overlay disables custom display and vendor hardware DXE to preserve ABL scanout; enabling the whole vendor dependency chain was associated with loss of display."]
completion = ["A pinned firmware build preserves reviewed memory reservations and enters the intended loader with a usable log channel on this board."]
limits = ["The source-only overlay imports no proprietary firmware inputs. New hardware boot, scanout stride/format, reserved memory and EL1 PAC remain unqualified.", "A previous UniXNU menu observation does not qualify this rebuilt FD or macOS userspace."]
next_action = ["The physical-key candidate passed cloud compilation and local ten-module FV verification. Next qualify physical keys on this exact FD in a separately authorized device test."]
evidence = [{ kind = "source", reference = "docs/UEFI_AUDIT.md", result = "Records the fixed base, board delta, forty memory ranges and source-only limits." }, { kind = "source", reference = "firmware/patches/README.md", result = "Explains the audited SimpleFb error-path fixes and their host checks." }, { kind = "host", reference = "https://github.com/limingerf/UniXNU-tb710fu/actions/runs/43618658596", command = "python3 tools/ci_firmware.py build", revision = "4497de4724af619b9cd5ec74d9ec6a8354d459f9", result = "Official AARCH64 DEBUG CLANGPDB firmware build passed; 3145728-byte FD and nine required modules verified in two actual nested FVs; SHA-256 independently verified in docs/evidence/uefi-build.json. Hardware remains unqualified." }, { kind = "host", reference = "https://github.com/limingerf/UniXNU-tb710fu/actions/runs/43636909923", command = "python3 tools/ci_firmware.py build", revision = "e7f3c7ca74a953e7f6fe8aaf897eaf2133514d05", result = "Physical-key candidate compiled successfully; sanitized host model passed. The 3145728-byte FD SHA-256 4fc321fb77ebad6f63970ae617228eef6be3bf98d98af5cfd4497ea51cd85b9b independently matched; ten module GUIDs and fourteen overlay hashes verified. Physical keys remain unverified; exact provenance is in docs/evidence/uefi-input-build.json." }]

[[area]]
id = "cpu"
status = "planned"
components = ["ArmCpu"]
paths = ["dts/*cpu*", "package/*Cpu*", "scripts/*cpu*", "scripts/*gic*"]
inputs = ["Board-specific enabled MPIDRs, PSCI method, GIC redistributor affinities, timer frequency and per-core EL1 PAC evidence."]
configuration = ["ArmCpu is selected for compilation. The successful kernel build does not supply a qualified board DTS or an SMP hardware result."]
procedure = ["1. Compare the selected stock DTB and DTBO with the pinned same-device Linux reference.", "2. Qualify the primary core, PSCI and timer before enabling secondary cores.", "3. In a later authorized device test, record each enabled MPIDR, GICR affinity, timer/IPI checkpoint and required PAC behavior."]
findings = ["The same-device reference disables physical affinities 0x100 and 0x200, leaving 0x000, 0x300, 0x400, 0x500, 0x600 and 0x700. Linux logical CPU numbering must not replace physical affinity values.", "Previous Android evidence reports six logical CPUs and EL0 paca/pacg features. It does not establish per-core EL1 PAC operation or successful XNU SMP."]
completion = ["Every enabled core reaches its entry checkpoint with matching affinity, working local timer and IPI, and the selected arm64e requirements pass."]
limits = ["No core has been qualified by this clean project. The timer frequency and GICR mapping still require board evidence."]
next_action = ["Parse the selected local stock DTB/DTBO and retain a redacted CPU, PSCI, timer and GIC fact table."]
evidence = [{ kind = "source", reference = "https://github.com/SpendyYT/tb710fu-linux/blob/4d04410798b538fbe4b50664e3a66d9500a2ed31/arch/arm64/boot/dts/qcom/sm8650.dtsi", result = "Same-device reference declares the six enabled affinities and the SM8650 PSCI/GIC resources; this is source evidence." }]

[[area]]
id = "memory"
status = "planned"
components = ["ArmDTPlatform"]
paths = ["dts/**", "package/*Memory*", "package/*Smmu*", "scripts/*memory*", "scripts/*smmu*"]
inputs = ["Selected live firmware DT, DDR banks, stock reserved ranges, UEFI memory descriptors, loader allocations and DMA ownership."]
configuration = ["The clean build has no board DTS and does not invent a DRAM window, reservation map or DMA translation."]
procedure = ["1. Extract actual DDR and reserved ranges from qualified stock inputs.", "2. Compare them with the same-device reference and previous UEFI memory table.", "3. Account for all loader, display, secure firmware and DMA allocations before configuring an owned-memory window."]
findings = ["The previous handwritten minimal DTS has a zero-length memory declaration and an invalid ranges encoding; it is excluded from the clean project.", "The previous UEFI overlay includes display demura and high-DDR reservations. Their values require comparison with this device's selected firmware DT before reuse."]
completion = ["All memory and handoff ranges are accounted for, non-overlapping and correctly attributed; each enabled DMA engine has documented addressing and cache rules."]
limits = ["No clean-project DT or DMA engine is qualified. Mainline reserved-memory alone cannot establish the live firmware DDR layout."]
next_action = ["Generate a range comparison from local stock DTB/DTBO and UEFI inputs without reusing the invalid handwritten DTS."]
evidence = [{ kind = "source", reference = "docs/HARDWARE.md", result = "Separates stock inputs, mainline reference data and rejected previous DTS content." }]

[[area]]
id = "usb"
status = "host-verified"
components = []
paths = ["package/Kit.toml", "package/Tb710fuUsbCdc/**", "scripts/check_usb_cdc_protocol.py", "scripts/build-tb710fu-cdc-log.py", "patches/xnu/0010-tb710fu-cdc-kernel-log-tap.patch", "tests/usb_cdc_protocol_test.c", "docs/USB_CDC_PORT.md", "scripts/check_usb_cdc_hardware.py", "scripts/check_usb_cdc_transport.py", "tools/verify_cdc_integration.py", "patches/xnu/0012-tb710fu-cdc-start.patch"]
inputs = ["Static DWC3/PHY/clock resources, XNU 12377 DMA and log interfaces, and host-side CDC enumeration. Current role, PHY and SMMU ownership are checked by the controller during initialization."]
configuration = ["Independent USB2 CDC protocol/core, 64 KiB nonblocking RAM tap, permanent contiguous 16 KiB DMA and XNU polling worker. Runtime tb710fu-cdc=1 enables live SM8650 role/clock/PHY/SMMU checks; no clock, PHY, PMIC or SMMU reinitialization."]
procedure = ["1. Run protocol, hardware-predicate and actual DWC3 production-core host tests under ASan/UBSan.", "2. Build all six sources with the actual native C compilation record and verify actual BSD strong reference, final definitions and archive force-loading.", "3. Strictly prelink and check the production loader parser; bind any CDC-enabled image to the exact additional archive/integration reports.", "4. On separately authorized hardware, verify initial enumeration and open the COM/tty port with DTR; capture expected bytes and independently qualify stop/panic behavior."]
findings = ["The TWRP DT declares DWC3 at 0x00a600000, nested stream ID 0x40, dr_mode=otg and atomic DMA. It also describes the eUSB2 PHY and clocks; these are Linux/TWRP inputs, not proof of XNU handoff state.", "The production DWC3 core implements EP0 SETUP/DATA/STATUS, full/high-speed and other-speed descriptors, line coding, DTR, SerialState, log IN and discard-only OUT. A SETUP-only reset is preserved for common Windows initial enumeration; active-transfer reset/disconnect recovery remains unsupported.", "The source-backed adapter dynamically validates the unique identity SID40 route and address width, checks every DMA page, rechecks ownership, then applies HS QSCRATCH VBUS override and controller halt/reset. PHY control bits do not prove analog/rail readiness.", "ASan/UBSan protocol/ring/tap, hardware predicates and actual core MMIO/DMA-model tests passed. Logs commit only after completed IN; failed ring-consume lock retries do not retransmit bytes. This is host evidence, not a COM-port result.", "Run 44088845841 passed all six real CDC source compilations, actual BSD strong import, final native transport definitions, force-load input, strict prelink and production parser. Local Git-object source/header, command, dependency and archive hashes independently matched. The 15-input candidate enables tb710fu-cdc=1 and verifies 12 strong transport definitions in the final fileset.", "The user subsequently authorized local signing for testing. The verified candidate now has a signed matching boot/vendor_boot/vbmeta delivery, independently verified against its unchanged payload and existing boot chain. This is signing/host evidence; no COM port or USB bytes were observed.", "The user reports white band and no QR on the initial signed CDC candidate. The fileset-header repair was present; the independent reporter post-link step was omitted, so the actual input had no QR segments/entry markers. The corrected signed replacement restores them without changing CDC/storage runtime code. QR display and USB output remain unverified.", "The user reports src-503599a0-cdc-qr at stage 56, ramoops returned, with no port. This confirms QR recovery but is the old last observation, not a fault PC or proof of BSD/CDC execution. The new signed src-503599a0-plat-qr derivative adds 17 arm_init wrappers through entry-only machine_startup at stage 89; actual parent ranges and BL occurrences, 52 spans/45 sites and unchanged 13 runtime functions (7656 bytes) are verified. The additional QR replays can add 66 seconds. No no-port fix, enumeration, USB bytes or hardware root boot is established."]
completion = ["XNU reports through a host-enumerated CDC ACM port, the host captures the expected bytes without drops, and an intentional stop/panic path is separately verified."]
limits = ["No TB710FU enumeration or USB byte-capture result exists. Target compilation, final native integration, strict prelink and unsigned packaging passed in run 44088845841 and its bound local image record. Firmware analog readiness and live ownership remain hardware gates. Active-DMA reset, disconnect and reconfiguration stop the session and retain DMA permanently. The scheduled worker cannot promise pre-BSD output or final panic bytes after scheduling stops."]
next_action = ["Test the exact signed src-503599a0-plat-qr candidate, allow up to 66 additional seconds of replay, and retain the final complete QR text. Stage89 proves machine_startup entry only; separately verify BSD/CDC enumeration, DTR and captured bytes."]
evidence = [{ kind = "host", reference = "tests/usb_cdc_protocol_test.c", command = "CC=cc python scripts/check_usb_cdc_protocol.py", revision = "919b4bdbc63ace99271a9442e3af3673a0ed8075", result = "Host descriptor, malformed-request, log-ring and fail-closed DWC3 preflight tests passed under AddressSanitizer/UndefinedBehaviorSanitizer; there is no XNU state reader, controller transport or enumeration yet." }, { kind = "host", reference = "https://github.com/limingerf/UniXNU-tb710fu/actions/runs/44075573981", command = "TB710FU macOS 27 kernel workflow_dispatch with stage=ufs-integrated", revision = "9f01899957060ffbd81a49c793438ba152760eb9", result = "The selected XNU character hooks and CDC RAM tap archive passed the native build and remained linked through strict prelink. No DWC3 transport, USB drain or host-visible CDC port is supplied." }, { kind = "source", reference = "docs/USB_CDC_PORT.md", result = "Records the hardware-independent implementation, source provenance and outstanding device gates." }, { kind = "source", reference = "https://github.com/tycykp/UniXNU-OnePlus-Ace5/blob/main/hardware/ios16-bringup-verified.json", result = "Ace 5 reports CDC COM21 with 8,802 status bytes and no drops on Darwin 22; this is reference-device evidence." }, { kind = "source", reference = "https://github.com/SpendyYT/tb710fu-linux/blob/4d04410798b538fbe4b50664e3a66d9500a2ed31/arch/arm64/boot/dts/qcom/sm8650.dtsi", result = "Pinned SoC source declares UFS host resources and SID 0x60; TWRP FDT details are summarized with hashes in docs/USB_CDC_PORT.md." }, { kind = "host", reference = "docs/evidence/usb-cdc-integrated-44088845841.json", command = "TB710FU macOS 27 kernel workflow_dispatch stage=ufs-integrated; verify native CDC/storage integration, strict prelink and production DarwinBoot parser", revision = "c0154c9d5e7048f7896614e1ca8d65be7d4d0e10", result = "Run 44088845841 passed all three sanitized CDC host checks, six-source actual target compilation, strong BSD/native integration, strict prelink and production parser. ZIP SHA-256 346ec4a926a72bf6bc52768aaa50546858f966c629db20a820859ea8deef8369 independently matched. Actual COM enumeration remains unverified." }, { kind = "host", reference = "docs/evidence/usb-cdc-image-44088845841.json", command = "python3 tools/package_source_storage.py --manifest <recorded-inputs.json> --manifest-sha256 f32068c96c0a635c11ffc088cd77df6463249ffebe54b4fd5bf2242cf64c98b2 --output-dir out/usb-cdc-44088845841", revision = "c0154c9d5e7048f7896614e1ca8d65be7d4d0e10", result = "All 15 exact inputs, six actual CDC objects and 12 strong final transport definitions passed with the existing signature/parser/loader/LZMA/ADT/FAT gates. Unsigned image is 37859328 bytes, SHA-256 49b216089db0cec46772cbba068178fb82e12d86af3ba0c5e925cf0a26ed416c. tb710fu-cdc=1 selected; no private key, signing or device operation." }, { kind = "host", reference = "docs/evidence/usb-cdc-signed-44088845841.json", command = "Unchanged tools/sign_kernel_probe_pair.py with exact unsigned SHA; independently recompute RSA, salted hashes, descriptor equality, boot chain key and FAT/kernel readback", revision = "ebeff37f24c6a6eedf2f91210bda772a32bef099", result = "Explicit user-authorized local signing completed. Signed vendor_boot SHA-256 80fd313b2c349bb89fa3790dc6caf4fd577ad09f0767ec79c2de7c71f796b279; matching vbmeta e8a4d1da9db5d60dedeade8ab3d12ae12f45d84be8b7bb036bcba101d2865323. Existing matching boot included. All three RSA structures, boot/vendor hashes, 22 unrelated descriptors, header/key/rollback and payload readback passed. No device operation or actual CDC enumeration." }, { kind = "source", reference = "docs/evidence/usb-cdc-qr-regression-44088845841.json", result = "Authenticated GitHub ref c87876e is already an ancestor; 0006-0009 exactly match actual CDC CI inputs. The earlier signed CDC kernel lacks both reporter segments because its independent post-link step was omitted. A user reports white band/no QR, with no exact device partition readback; missing diagnostics does not establish the stall cause." }, { kind = "host", reference = "docs/evidence/usb-cdc-qr-transform-44088845841.json", revision = "4e31ed1d82032124609f1230478fb9ed6f2a1e42", command = "prepare_early_report.py with exact 503599a0 input, cdc-qr suffix, trace-past-switch and trace-switch-probe; independent bounded delta and real runtime function checks", result = "Derived kernel 2410ec0545996500af0e8c051f4ce33f9941685a6cc73c63b082a51222da0b7f has 35 bounded spans, 28 wrappers, 3 compact checkpoints and appended RX/RW-NX reporter. All 13 CDC/storage function definitions and 7656 code bytes are unchanged. Default path has no stopping checkpoint. Twelve mutation tests pass; four actual-input mutations rejected." }, { kind = "host", reference = "docs/evidence/usb-cdc-qr-signed-44088845841.json", revision = "4e31ed1d82032124609f1230478fb9ed6f2a1e42", command = "17-input unsigned packaging followed by existing explicitly authorized local AVB signing, independent RSA/hash/payload and ZIP readback checks", result = "Restored-QR signed ZIP SHA-256 0a73220da6fa8327029d47048521a7f686e7661ccc101114ef905f2f18768d82, 35557611 bytes; label src-503599a0-cdc-qr. Original CI prelink report remains unchanged, actual derivative parser and four FAT readbacks passed. No device command or real QR/CDC hardware verification." }, { kind = "source", reference = "docs/evidence/usb-cdc-stage56-device-20261117.json", result = "User supplied stage56 live QR with restored reporter and no port; exact device partition hashes, BSD/CDC execution and the failure cause are not established." }, { kind = "host", reference = "docs/evidence/usb-cdc-platform-signed-44088845841.json", revision = "608c701ab5690f32bc3a36a571a7cba6fc1984c1", command = "Verify 45 original BL wrappers/52 spans and caller ranges, 16 mutations, host/AArch64 QR; 17-input packaging, authorized signing and independent RSA/payload/ZIP readback", result = "Signed platform trace ZIP SHA-256 5bbd067261f417a44826b43077404f6db92642147a439e9e21771993cbcba9e7, 35559274 bytes, label src-503599a0-plat-qr. Original 44088845841 prelink reports remain unchanged; no device command or proven CDC enumeration." }]


[[area]]
id = "storage"
status = "host-verified"
components = []
paths = ["package/*Ufs*", "package/Source*.cpp", "package/Tb710fuSourceStorage/**", "scripts/*ufs*", "scripts/*storage*", "scripts/*userdata*", "scripts/*root*", "tools/verify_storage_integration.py", "patches/ufs/**", "feeds.toml", "docs/UFS_PORT.md", "docs/evidence/ufs-gpt-lba1-twrp.json"]
inputs = ["UFS controller and PHY resources, clocks, resets, supplies, SMMU stream, actual LUN/block geometry and an approved root-volume layout. Runtime DMA and queue ownership are checked by the driver during initialization."]
configuration = ["CONFIG_XNU_SOURCE_STORAGE=y selects the explicit complete source-storage archive and conditional strong bsd_init startup call after vfsinit(). CONFIG_XNU_NATIVE_UFS=n keeps automatic personalities absent. Persistent Data, RAM storage, optional hardware providers and device storage writes remain outside this build."]
procedure = ["1. Reconcile the same-device UFS source with the pinned SM8650 Linux DTS and TWRP block sample.", "2. Build the standalone NativeUfs adapter against the minimal kernel's compiler record, then review kernel archive, root policy and macOS storage ABI integration separately.", "3. Implement and host-test a transactional firmware takeover: read and validate controller/link, queue, DMA and SMMU state before writes; restore the original queue/context on recoverable failure and verify rollback.", "4. Supply the device-owned SourceStorage, SourceRootPolicies and SourceRootBinding implementations, audit the macOS 27 block-storage ABI, and select the explicit archive/configuration and strong startup hook.", "5. Build native and strict prelink, verify the actual BSD/native/linkarchive evidence and production loader parser, then prepare an unsigned candidate tied to the ADT-correct baseline, matching RootPolicies and explicit UFS root arguments.", "6. Keep signing and device validation separate; qualify firmware handoff, transactional takeover, known reads, media publication and root mount before userspace or persistence claims.", "7. Review root and persistent Data layout independently before any storage write work."]
findings = [
  "The TWRP FDT and pinned Linux DTS declare SM8650 UFS host 0x01d84000/0x3000, PHY 0x01d80000/0x2000 and stream ID 0x60; the FDT also declares ICE/MCQ resources and fastmap DMA. These do not prove XNU queue ownership, live SMMU mappings or DMA coherence.",
  "The pinned same-device Linux DTS declares GIC SPI 265 level-high, controller reset GPIO 210 active-low, vcc/vccq and PHY supply references, two lanes, dma-coherent, UFS clock/reset/GDSC dependencies, interconnect paths and OPP entries. These are source declarations, not current firmware state.",
  "Linux ufs-qcom cold-start resets host and PHY, initializes and sets PHY mode, powers/calibrates the PHY, then selects UniPro mode. The matching SM8650 QMP driver has a two-lane PHY v6 table through HS-G5. ShengUfs instead adopts the running firmware controller/link, so neither source's sequence establishes the live handoff state.",
  "TWRP read-only sample: user LUN /dev/block/sda, 4096-byte logical blocks, GPT-header LBA 1. The 4096-byte sample CRC32 is 44b9c49a and its GPT header CRC validates; this is not an XNU read result.",
  "The host-only UfsReadProbe contract covers DMA mapping checks, idle-queue takeover, READ(10), quiescence, restoration and quarantine. It has no XNU register/DMA callbacks and is not a prerequisite probe or hardware driver.",
  "Run 44041029817 built a standalone libTb710fuNativeUfs.a (541448 bytes, SHA-256 56a28627693c848f450614f293f3661f1632112ca1801cf2bdc004f341768c3c) from ShengUfs revision 99d8bcd3e43dd24fc3c8437c67b5d4cc71ab94d0. The report says linked_into_kernel=false, root_policy_ready=false and runtime_qualified=false.",
  "The pinned source identifies as SM8550 bring-up and hardcodes qcom,sm8550-ufshc; the board patch adds qcom,sm8650-ufshc. Controller, GCC, interrupt, reset, rail and PHY declarations cross-check to the pinned same-device source, but firmware clock/reset state and XNU SMMU/DMA ownership remain unverified.",
  "NativeUfs assumes firmware initialized the controller and link, checks that the request queue can be stopped while idle, then configures SID 0x60 with contiguous DMA. It does not provide qualified TB710FU reset, clock or PHY initialization.",
  "Board patch 0002 moves read-only SMMU planning and queue-state capture ahead of host writes, applies SMMU changes transactionally, restores the firmware queue after recoverable failure, and proves replacement DMA is stopped before rollback. It also rejects legacy firmware-list adoption probes. Run 44068063538 compiled it with the pinned macOS 27 compiler record and passed the host fault tests. The 595544-byte archive SHA-256 is bec56cbe2f42e76a0d162183f861da78d5a6336dcd78f36c645137125e6b561d; it remains unlinked and not hardware-tested.",
  "The pinned DarwinBoot payload path can carry a VROOTB01 RootPolicies bundle and populate /chosen/memory-map/RootPolicies. All three source-storage bridges and the minimal complete archive passed target compilation and native integration in run 44075573981. Signed-policy parsing and identity/parent binding have host tests; firmware handoff and startup execution on hardware remain unexercised.",
  "Public IOStorageFamily headers and the profile-selected build source use XNU 12377.121.6. The profile separately identifies Apple's original 26C5035r KernelCache kernel as XNU 13432.60.57; that is the binary prelink/ABI input, not the source compiled here. A retained IOStorageFamily/APFS fileset from that exact profile KernelCache supplies the static dispatch/PAC comparison, separate from bridge compilation, linkage and runtime qualification.",
  "Run 44075573981 at 9f01899957060ffbd81a49c793438ba152760eb9 passed native source-storage integration, strict prelink and the production DarwinBoot parser. Its separate integration report binds the actual startup reference, final symbols, archive and saved force-load input. Artifact 14324417743 is 38354358 bytes with GitHub digest df2802dc432b0290e6b8db0c2a1ef27db8fc6469de2b9fb08351e9fd1d9b8016. The existing signed UEFI-UFS image remains a separate firmware artifact.",
