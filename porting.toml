  "Owner-signed OS, SystemOS and App root policies pass VerifiedRoot C signature and full block verification, and their raw .vroot tables are present in a rebuilt SHNGROOT v2 userdata image. The integrated kernel contains the real policy loader and binding code, but no hardware policy handoff, root-image read or authentication has been observed.",
