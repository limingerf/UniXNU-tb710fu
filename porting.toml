[[area]]
id = "diagnostics"
status = "planned"
components = []
paths = ["hardware.toml", "docs/**", "diagnostics/**", "patches/xnu/0006*", "patches/xnu/0009*", "patches/xnu/README.md", "patches/xnu/series", "tools/github_admin.py", "tools/check-*", "tools/check_*", "tools/package_kernel_diagnostic.py", "tools/prepare_early_report.py", "tools/sign_kernel_probe_pair.py", "tools/verify_kernel.py", "scripts/read-*", "scripts/probe-*", "unixnu.lock"]
inputs = ["Complete source revisions, bounded CI logs and artifact hashes; later device logs identifying firmware, image and the last confirmed stage."]
configuration = ["hardware.toml is an evidence inventory, not a UniXNU runtime configuration. docs/HARDWARE.md separates historical observations from clean-project qualification."]
procedure = ["1. Run the official porting-record checker against this repository.", "2. Preserve the first actual CI failure and diagnose it before another build.", "3. Add device evidence only after a separately authorized test, recording firmware/image identity and an actual checkpoint."]
findings = ["Run 43844823907 passed native build, strict prelink and the production parser. The diagnostic models, QR render/decode and fixed OneSend receiver pass for the recorded stages.", "The device reporter changes in patches/xnu/0006 and 0009 preserve diagnostics across the fileset and switch boundary; they are observability changes, not a functional MMU fix.", "The TWRP GPT-header sample is a read-only Linux/TWRP storage baseline and is not an XNU UFS result.", "The user supplied a guard11-labelled hardware report, src-eff36305-guard11, with STAGE=56 and XNU returned: tb710fu_ramoops_init at physical zone 0x93ff00000. This is evidence of reaching that early-kernel checkpoint, not root-volume or userspace boot.", "No device partition hash binds the report to the exact signed guard11 pair. The ramoops header/content and cross-reset retention remain unverified; the signed pair's independent RSA and payload readback checks passed.", "Run 44075573981 and its separate unsigned-packaging record bind the new storage archive, integrated native input, prelinked fileset, static ABI audit and candidate image through exact hashes. The historical stage-56 observation does not qualify this new image; its selected CDC RAM tap still has no USB transport or enumeration.", "The independent DWC3 transport, live hardware adapter and strong BSD hook are now source-implemented. Protocol/hardware/core host checks pass; compile/link evidence and actual CDC enumeration remain separate stages. Source provenance is in docs/evidence/usb-cdc-sources.json.", "Run 44088845841 now establishes full six-source transport target compilation, final strong CDC/storage integration, strict prelink and production parser success. Its independently verified artifact and 15-input unsigned candidate are recorded with exact source/run/hash provenance. No actual COM enumeration, USB log capture or hardware boot of this candidate is established. Earlier failed runs and the queued cancellation remain separately recorded in usb-cdc-build-attempts.json.", "The subsequent explicit local-signing request is complete. The new signed set and ZIP have independent RSA, salted-hash, descriptor/header/key/rollback and FAT/kernel readback evidence. This host result does not change earlier runtime fields or establish a device boot, COM enumeration or USB log capture.", "The user reports white-band/no-QR behavior for the earlier CDC delivery. An authenticated branch/history/hash audit proves the fileset-aware 0006 repair was synced; binary inspection proves the reporter segments and compact entry markers were absent from that delivered kernel. The corrected src-503599a0-cdc-qr derivative is now packaged/signed with bounded-delta and final parser evidence. This fixes the missing diagnostic attachment, not an established hardware stall cause.", "The user reports src-503599a0-cdc-qr at stage 56, ramoops returned, with no port. This confirms QR recovery but is the old last observation, not a fault PC or proof of BSD/CDC execution. The new signed src-503599a0-plat-qr derivative adds 17 arm_init wrappers through entry-only machine_startup at stage 89; actual parent ranges and BL occurrences, 52 spans/45 sites and unchanged 13 runtime functions (7656 bytes) are verified. The additional QR replays can add 66 seconds. No no-port fix, enumeration, USB bytes or hardware root boot is established."]
completion = ["Each reported milestone has a reproducible invocation, full source revision and accessible matching evidence; secrets and personal identifiers remain excluded."]
limits = ["The guard11-labelled stage-56 report has no matching device partition hash. Valid ramoops contents/retention, root-volume mount, native UFS operation and macOS userspace remain unqualified."]
next_action = ["Test the exact signed src-503599a0-plat-qr candidate, allow up to 66 additional seconds of replay, and retain the final complete QR text. Stage89 proves machine_startup entry only; separately verify BSD/CDC enumeration, DTR and captured bytes."]
