 code is compared across the transformation, and all final FAT files/unsigned payload/RSA structures/ZIP members are rechecked.", "The user reports src-503599a0-cdc-qr at stage 56, ramoops returned, with no port. This confirms QR recovery but is the old last observation, not a fault PC or proof of BSD/CDC execution. The new signed src-503599a0-plat-qr derivative adds 17 arm_init wrappers through entry-only machine_startup at stage 89; actual parent ranges and BL occurrences, 52 spans/45 sites and unchanged 13 runtime functions (7656 bytes) are verified. The additional QR replays can add 66 seconds. No no-port fix, enumeration, USB bytes or hardware root boot is established."]
completion = ["The native/prelinked kernel artifacts have exact source and hash provenance; every image stage meets its own official format, ABI and readback checks before being reported complete."]
